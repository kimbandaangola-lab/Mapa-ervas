
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: Nenhum arquivo ZIP encontrado na raiz do repositório."
            exit 1
          fi
          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

      - name: Conferir pasta do aplicativo
        shell: bash
        run: |
          if [ ! -f "projeto/MapaErvasBuild/settings.gradle" ] && \
             [ ! -f "projeto/MapaErvasBuild/settings.gradle.kts" ]; then
            echo "ERRO: Não encontrei o projeto Gradle em projeto/MapaErvasBuild."
            echo "Confira a estrutura do arquivo ZIP."
            find projeto -maxdepth 4 -type f | head -n 100
            exit 1
          fi

      - name: Compilar aplicativo
        run: |
          cd projeto/MapaErvasBuild
          gradle --no-daemon assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mapa-de-Ervas-APK
          path: projeto/MapaErvasBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
